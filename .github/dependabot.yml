version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/src/frontend/meu-financeiro"
    schedule:
      interval: "weekly"
    groups:
      angular:
        patterns:
          - "@angular/*"
      # jasmine-core e karma-jasmine-html-reporter têm peer dependency cruzado entre si
      # (karma-jasmine-html-reporter só suporta um range fechado de major de jasmine-core) —
      # bumpar um sem o outro reproduz o mesmo tipo de ERESOLVE do grupo "angular" acima.
      testing:
        patterns:
          - "jasmine-core"
          - "@types/jasmine"
          - "karma-jasmine"
          - "karma-jasmine-html-reporter"
