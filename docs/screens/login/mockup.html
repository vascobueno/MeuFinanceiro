<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
:root{--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#707b8f;--blue:#315efb;--green:#12966f;--red:#d94b62;--yellow:#c58a00;--line:#e7eaf0;--side:#111827}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px Inter,system-ui,sans-serif}.sidebar{position:fixed;inset:0 auto 0 0;width:245px;background:linear-gradient(180deg,#101827,#182235);color:#cbd5e5;padding:20px 14px}.brand{display:flex;gap:10px;align-items:center;color:#fff;font-weight:800;font-size:18px;margin:4px 8px 28px}.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6381ff,#315efb);display:grid;place-items:center}.section{font-size:9px;letter-spacing:.14em;color:#77849b;margin:20px 10px 7px}.nav a{display:block;color:#aebbd0;text-decoration:none;padding:10px;border-radius:8px;margin:2px 0}.nav a.active,.nav a:hover{background:#202d43;color:#fff}.main{margin-left:245px}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:3}.search{background:#f7f8fa;border:1px solid var(--line);padding:8px 12px;border-radius:8px;width:260px;color:#8993a4}.search input{border:0;background:transparent;outline:0;width:220px}.page{padding:28px 30px;max-width:1550px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:10px;text-transform:uppercase;font-weight:800;letter-spacing:.12em}.title{font-size:27px;font-weight:800;margin:3px 0}.sub{color:var(--muted);font-size:12px}.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:700;font-size:11px}.primary{background:var(--blue);color:white}.secondary{background:white;border:1px solid var(--line);color:var(--text)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 9px 28px #1420370a}.body{padding:18px}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.label{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.04em}.value{font-size:24px;font-weight:800;margin:7px 0}.small{font-size:10px;color:var(--muted)}.positive{color:var(--green)}.negative{color:var(--red)}.hero{background:linear-gradient(135deg,#203da5,#315efb 60%,#6381ff);color:white;border-radius:12px;padding:18px;box-shadow:0 14px 30px #315efb2b}.hero .label,.hero .small{color:#dbe4ff}.filter{padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:15px 0}.fg{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.field label{display:block;font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:9px;border:1px solid #dfe3ea;border-radius:7px;background:#fff}.tablebox{overflow:hidden;margin-top:15px}.tablehead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.tabletitle{font-weight:800}.table{width:100%;border-collapse:collapse;font-size:11px}.table th{text-align:left;background:#fafbfc;color:#778196;font-size:9px;text-transform:uppercase;padding:11px 14px;border-bottom:1px solid var(--line)}.table td{padding:12px 14px;border-bottom:1px solid #eef0f4}.table tr:hover td{background:#fafcff}.money{text-align:right;font-weight:800}.badge{display:inline-block;border-radius:20px;padding:4px 8px;font-size:9px;font-weight:800}.ok{background:#e8f7f1;color:#087957}.warn{background:#fff5dc;color:#946000}.bad{background:#ffedf0;color:#bd334a}.neutral{background:#eef1f5;color:#626d7f}.two{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-top:14px}.chart{height:230px;padding:15px}.timeline{padding:8px 20px}.event{border-left:1px solid #dce2eb;padding:0 0 18px 18px;position:relative}.event:before{content:'';position:absolute;left:-5px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px #edf1ff}.form{padding:22px}.formgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}.s3{grid-column:span 3}.alert{padding:11px;border-radius:8px;font-size:11px;background:#eef3ff;color:#3151a6}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#dfe7ff,#f4f6fa 45%)}.loginbox{width:410px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px;box-shadow:0 25px 60px #1a27431f}.loginbox input{width:100%;padding:11px;border:1px solid #dfe3ea;border-radius:8px;margin:6px 0 14px}.loginbtn{width:100%;padding:11px;border:0;border-radius:8px;background:var(--blue);color:white;font-weight:800}@media(max-width:900px){.sidebar{width:70px}.brand span:last-child,.section,.nav a span{display:none}.main{margin-left:70px}.g4,.g3{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.fg{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.sidebar{display:none}.main{margin-left:0}.page{padding:20px 14px}.g4,.g3,.g2,.fg{grid-template-columns:1fr}.formgrid>*{grid-column:span 12!important}.search{width:150px}}
