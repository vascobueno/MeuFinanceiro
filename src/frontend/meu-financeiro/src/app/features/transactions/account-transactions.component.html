<div class="mf-list-header">
  <div>
    <h2 class="mf-page-title">
      <mf-icon name="mf-transactions" class="mf-page-title-icon"></mf-icon>Lançamentos da conta
    </h2>
  </div>
</div>

<div class="mf-account-bar">
  <div class="mf-account-picker">
    <label class="mf-field-label">Conta</label>
    <p-select
      size="small"
      class="mf-field-input"
      [options]="accountOptions()"
      optionLabel="name"
      optionValue="id"
      [(ngModel)]="selectedAccountId"
      (onChange)="onAccountChange()"
    />
  </div>

  <mf-stat-card
    class="mf-account-balance"
    size="compact"
    label="Saldo atual"
    [value]="balance | currency: 'BRL'"
    [hint]="balanceHint"
    variant="hero"
  ></mf-stat-card>
</div>

<mf-transaction-filters
  [filter]="filter"
  [categories]="categories()"
  (changed)="applyFilters()"
></mf-transaction-filters>

<div class="mf-panel">
  <!-- Sempre renderizado: a ação de criar mora aqui, e escondê-la na lista vazia tiraria o
       botão justamente de quem ainda não tem lançamento nenhum. -->
  <div class="mf-panel-header">
    <b>Lançamentos</b>
    @if (authService.canWrite()) {
      <a pButton size="small" routerLink="/lancamentos/conta/novo">+ Novo lançamento</a>
    }
  </div>

  <div class="mf-panel-body">
    <mf-transaction-table
      [transactions]="transactions()"
      [loading]="loading()"
      [error]="error()"
      [canWrite]="authService.canWrite()"
      [onRetry]="load.bind(this)"
      (sort)="onSort($event)"
      (remove)="remove($event)"
    ></mf-transaction-table>

    @if (!loading() && !error() && transactions().length > 0) {
      <mf-pagination
        class="mf-pagination-block"
        [page]="filter.page"
        [totalPages]="totalPages()"
        [totalItems]="totalItems()"
        (pageChange)="onPageChange($event)"
      ></mf-pagination>
    }
  </div>
</div>
