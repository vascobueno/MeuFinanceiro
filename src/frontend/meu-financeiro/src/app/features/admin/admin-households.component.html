<div class="mf-list-header">
  <h2 class="mf-page-title"><mat-icon svgIcon="mf-admin" class="mf-page-title-icon"></mat-icon>Households</h2>
  <div class="mf-sub">Todos os espaços do sistema, com seus donos e membros.</div>
</div>

<div class="mf-panel">
  <mf-list-state
    [loading]="loading()"
    [error]="error()"
    [empty]="!loading() && !error() && households().length === 0"
    emptyMessage="Nenhum household cadastrado ainda."
    [onRetry]="load.bind(this)"
  ></mf-list-state>

  @if (!loading() && !error() && households().length > 0) {
    <table mat-table [dataSource]="dataSource" matSort class="mf-households-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Household</th>
        <td mat-cell *matCellDef="let h">{{ h.name }}</td>
      </ng-container>

      <ng-container matColumnDef="owner">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Owner</th>
        <td mat-cell *matCellDef="let h">{{ h.ownerName }} ({{ h.ownerEmail }})</td>
      </ng-container>

      <ng-container matColumnDef="members">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Membros</th>
        <td mat-cell *matCellDef="let h">{{ h.memberCount }}</td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Criado em</th>
        <td mat-cell *matCellDef="let h">{{ h.createdAt | date: 'dd/MM/yyyy' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let h" class="mf-col-end">
          <a mat-stroked-button [routerLink]="['/admin/households', h.id, 'membros']">Ver membros</a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  }
</div>
