<div class="mf-list-header">
  <h2 class="mf-page-title"><mf-icon name="mf-admin" class="mf-page-title-icon"></mf-icon>Grupos</h2>
</div>

<div class="mf-panel">
  <mf-list-state
    [loading]="loading()"
    [error]="error()"
    [empty]="!loading() && !error() && grupos().length === 0"
    emptyMessage="Nenhum grupo cadastrado ainda."
    [onRetry]="load.bind(this)"
  ></mf-list-state>

  @if (!loading() && !error() && grupos().length > 0) {
    <p-table [value]="grupos()" styleClass="mf-grupos-table">
      <ng-template #header>
        <tr>
          <th pSortableColumn="name">Grupo <p-sort-icon field="name" /></th>
          <th pSortableColumn="ownerName">Owner <p-sort-icon field="ownerName" /></th>
          <th pSortableColumn="memberCount">Membros <p-sort-icon field="memberCount" /></th>
          <th pSortableColumn="createdAt">Criado em <p-sort-icon field="createdAt" /></th>
          <th></th>
        </tr>
      </ng-template>
      <ng-template #body let-h>
        <tr>
          <td>{{ h.name }}</td>
          <td>{{ h.ownerName }} ({{ h.ownerEmail }})</td>
          <td>{{ h.memberCount }}</td>
          <td>{{ h.createdAt | date: 'dd/MM/yyyy' }}</td>
          <td class="mf-col-end">
            <a pButton [outlined]="true" [routerLink]="['/admin/grupos', h.id, 'membros']">Ver membros</a>
          </td>
        </tr>
      </ng-template>
    </p-table>
  }
</div>
